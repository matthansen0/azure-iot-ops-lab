#cloud-config
package_update: true
package_upgrade: false
write_files:
  - path: /etc/aio.env
    permissions: '0644'
    content: |
      SUBSCRIPTION=@@SUBSCRIPTION@@
      LOCATION=@@LOCATION@@
      OPS_RG=@@OPS_RG@@
      CLUSTER_NAME=@@CLUSTER_NAME@@
      STORAGE_ACCOUNT=@@STORAGE_ACCOUNT@@
      SCHEMA_REGISTRY=@@SCHEMA_REGISTRY@@
      SCHEMA_NAMESPACE=@@SCHEMA_NAMESPACE@@
      AIO_NAMESPACE_NAME=@@AIO_NAMESPACE_NAME@@
      KEYVAULT_NAME=@@KEYVAULT_NAME@@
      SECRET_SYNC_MI_NAME=@@SECRET_SYNC_MI_NAME@@
      CLOUD_MI_NAME=@@CLOUD_MI_NAME@@

  - path: /usr/local/bin/aio-install.sh
    permissions: '0755'

    content: |
      set -euo pipefail
      trap 'EXITCODE=$?; if [ $EXITCODE -ne 0 ]; then echo; echo "===== /var/log/aio-install.log (tail) ====="; tail -40 /var/log/aio-install.log; echo "===== END LOG ====="; fi' EXIT
      source /etc/aio.env

      log(){ echo -e "\e[1;36m==>\e[0m $*"; }

      sync_kubeconfig() {
        local target_config="/root/.kube/config"
        mkdir -p /root/.kube
        cp /etc/rancher/k3s/k3s.yaml "$target_config"
        chmod 600 "$target_config"
        local cluster_name
        cluster_name=$(kubectl config view --raw --kubeconfig "$target_config" -o jsonpath='{.clusters[0].name}' 2>/dev/null || true)
        local internal_ip
        internal_ip=$(kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get node -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null || true)
        if [[ -n "$internal_ip" && -n "$cluster_name" ]]; then
          kubectl config set-cluster "$cluster_name" --server="https://${internal_ip}:6443" --kubeconfig "$target_config" >/dev/null
        fi
        local context_name
        context_name=$(kubectl config view --raw --kubeconfig "$target_config" -o jsonpath='{.contexts[0].name}' 2>/dev/null || true)
        if [[ -n "$context_name" ]]; then
          KUBE_CONTEXT="$context_name"
        else
          KUBE_CONTEXT="default"
        fi
        export KUBECONFIG="$target_config"
      }

      # Host tuning
      log "Kernel tuning + disable swap"
      grep -q 'fs.inotify.max_user_instances' /etc/sysctl.conf || echo fs.inotify.max_user_instances=8192 | tee -a /etc/sysctl.conf
      grep -q 'fs.inotify.max_user_watches'  /etc/sysctl.conf || echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
      grep -q 'fs.file-max'                  /etc/sysctl.conf || echo fs.file-max=100000 | tee -a /etc/sysctl.conf
      sysctl -p || true
      swapoff -a || true
      sed -ri 's/^([^#].*\\s+swap\\s+)/#\\1/' /etc/fstab || true

      # Base deps
      log "Base packages"
      apt-get update -y
      apt-get install -y curl wget git jq ca-certificates apt-transport-https lsb-release gnupg

      # Azure CLI
      log "Install Azure CLI"
      if ! command -v az >/dev/null 2>&1; then
        curl -sL https://aka.ms/InstallAzureCLIDeb | bash
      fi
      az config set extension.use_dynamic_install=yes_without_prompt

      log "Login with your Azure user account (device code)"
      az login --use-device-code
      az account set --subscription "$SUBSCRIPTION"

      # Providers (idempotent)
      for rp in Microsoft.ExtendedLocation Microsoft.Kubernetes Microsoft.KubernetesConfiguration Microsoft.IoTOperations Microsoft.DeviceRegistry Microsoft.SecretSyncController; do
        az provider register -n "$rp" -o none || true
      done

      # Required extensions
      log "Ensure Azure CLI extensions"
      az extension add --name connectedk8s --upgrade -y
      az extension add --name azure-iot-ops --upgrade --allow-preview True

      # K3s
      log "Install K3s"
      if [[ ! -f /etc/rancher/k3s/k3s.yaml ]]; then
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode=644" sh -
      fi
      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
      until kubectl get nodes | awk 'NR>1{print $2}' | grep -q Ready; do sleep 3; done

      sync_kubeconfig

      # Helm
      if ! command -v helm >/dev/null 2>&1; then
        curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      fi
      # Make local-path default
      if kubectl get sc local-path >/dev/null 2>&1; then
        kubectl annotate sc local-path storageclass.kubernetes.io/is-default-class="true" --overwrite || true
      fi

      # Arc connect + features
      log "Arc connect"
      az extension add --name k8s-extension --upgrade -y
      az extension add --name k8s-configuration --upgrade -y
      az connectedk8s connect --name "$CLUSTER_NAME" --location "$LOCATION" --resource-group "$OPS_RG"

      sync_kubeconfig

      log "Enable OIDC issuer + workload identity"
      CONTEXT_FOR_ARC="${KUBE_CONTEXT:-default}"
      [[ -z "$CONTEXT_FOR_ARC" ]] && CONTEXT_FOR_ARC="default"
      UPDATE_ATTEMPTS=10
      for attempt in $(seq 1 $UPDATE_ATTEMPTS); do
        if az connectedk8s update --name "$CLUSTER_NAME" --resource-group "$OPS_RG" \
             --enable-oidc-issuer --enable-workload-identity \
             --kube-config /root/.kube/config --kube-context "$CONTEXT_FOR_ARC"; then
          echo "OIDC issuer and workload identity enabled (attempt $attempt)."
          break
        fi
        if [[ $attempt -eq $UPDATE_ATTEMPTS ]]; then
          echo "ERROR: Failed to enable OIDC issuer/workload identity after $UPDATE_ATTEMPTS attempts."
          exit 1
        fi
        echo "Enable OIDC/workload identity failed (attempt $attempt). Retrying in 30s..."
        sleep 30
      done

      log "Configure K3s API server for workload identity"
      ISSUER_URL=$(az connectedk8s show -g "$OPS_RG" -n "$CLUSTER_NAME" --query oidcIssuerProfile.issuerUrl -o tsv)
      if [[ -z "$ISSUER_URL" ]]; then
        echo "ERROR: Unable to retrieve OIDC issuer URL."
        exit 1
      fi
      TMP_K3S_CFG="/tmp/k3s-config.yaml"
      printf '%s\n' \
        "kube-apiserver-arg:" \
        "  - service-account-issuer=${ISSUER_URL}" \
        "  - service-account-max-token-expiration=24h" > "$TMP_K3S_CFG"
      K3S_CFG_PATH="/etc/rancher/k3s/config.yaml"
      if ! cmp -s "$TMP_K3S_CFG" "$K3S_CFG_PATH" 2>/dev/null; then
        mv "$TMP_K3S_CFG" "$K3S_CFG_PATH"
        systemctl restart k3s
        for attempt in $(seq 1 40); do
          if kubectl get nodes >/tmp/k3s-nodes.out 2>/dev/null; then
            if awk 'NR>1{print $2}' /tmp/k3s-nodes.out | grep -q Ready; then
              rm -f /tmp/k3s-nodes.out
              break
            fi
          fi
          rm -f /tmp/k3s-nodes.out
          sleep 3
          if [[ $attempt -eq 40 ]]; then
            echo "ERROR: k3s did not become Ready after restart."
            exit 1
          fi
        done
      else
        rm -f "$TMP_K3S_CFG"
      fi
      sync_kubeconfig

      log "Enable features (retry up to 15 minutes, refresh token every 5 attempts)"
      OBJECT_ID=$(az ad sp show --id bc313c14-388c-4e7d-a58e-70017303ee3b --query id -o tsv)
      MAX_ATTEMPTS=30  # 15 minutes at 30s per attempt
      for i in $(seq 1 $MAX_ATTEMPTS); do
        set +e
        OUTFILE="/tmp/arc_enable_features.out"
        az connectedk8s enable-features -n "$CLUSTER_NAME" -g "$OPS_RG" \
          --custom-locations-oid "$OBJECT_ID" \
          --features cluster-connect custom-locations > "$OUTFILE" 2>&1
        STATUS=$?
        set -e
        if [ $STATUS -eq 0 ]; then
          echo "Arc features enabled successfully (attempt $i)."
          break
        fi
        # Check for insufficient privileges error in both output and log
        if grep -q "Insufficient privileges" "$OUTFILE" || grep -q "Insufficient privileges" /var/log/aio-install.log 2>/dev/null; then
          echo "Insufficient privileges to enable Arc features (attempt $i). Waiting 30s and retrying..."
          sleep 30
        else
          echo "az connectedk8s enable-features failed for another reason. See $OUTFILE and log for details."
          cat "$OUTFILE"
          exit 1
        fi
        if [[ $i -eq $MAX_ATTEMPTS ]]; then
          echo "ERROR: Could not enable Arc features after $MAX_ATTEMPTS attempts (15 minutes). Exiting."
          exit 1
        fi
      done

      # AIO CLI ext + Azure resources
      log "AIO Azure resources"
      if ! az storage account show -n "$STORAGE_ACCOUNT" -g "$OPS_RG" >/dev/null 2>&1; then
        az storage account create --name "$STORAGE_ACCOUNT" --location "$LOCATION" --resource-group "$OPS_RG" --enable-hierarchical-namespace true -o none
      fi
      SA_ID=$(az storage account show --name "$STORAGE_ACCOUNT" -g "$OPS_RG" --query id -o tsv)

      if ! az iot ops schema registry show --name "$SCHEMA_REGISTRY" -g "$OPS_RG" >/dev/null 2>&1; then
        az iot ops schema registry create --name "$SCHEMA_REGISTRY" --resource-group "$OPS_RG" --registry-namespace "$SCHEMA_NAMESPACE" --sa-resource-id "$SA_ID" -o none
      fi
      SR_ID=$(az iot ops schema registry show --name "$SCHEMA_REGISTRY" -g "$OPS_RG" --query id -o tsv)

      if ! az iot ops ns show --name "$AIO_NAMESPACE_NAME" -g "$OPS_RG" >/dev/null 2>&1; then
        az iot ops ns create -n "$AIO_NAMESPACE_NAME" -g "$OPS_RG" -o none
      fi
      NS_ID=$(az iot ops ns show --name "$AIO_NAMESPACE_NAME" -g "$OPS_RG" --query id -o tsv)

      # Initialize AIO (let it own the foundation)
      log "AIO init"
      az iot ops init --cluster "$CLUSTER_NAME" --resource-group "$OPS_RG"

      # Create AIO instance
      log "AIO create"
      INST_NAME="${CLUSTER_NAME}-instance"
      if ! az iot ops show -g "$OPS_RG" -n "$INST_NAME" >/dev/null 2>&1; then
        az iot ops create --cluster "$CLUSTER_NAME" --resource-group "$OPS_RG" --name "$INST_NAME" \
          --sr-resource-id "$SR_ID" --ns-resource-id "$NS_ID" \
          --broker-frontend-replicas 1 --broker-frontend-workers 1 \
          --broker-backend-part 1 --broker-backend-workers 1 --broker-backend-rf 2 \
          --broker-mem-profile Low
      fi
      AIO_INSTANCE_NAME="$INST_NAME"
      AIO_INSTANCE_ID=$(az iot ops show -g "$OPS_RG" -n "$AIO_INSTANCE_NAME" --query id -o tsv)

      # Secure settings prerequisites (Key Vault + identities)
      log "Configure Key Vault for secure settings"
      if ! az keyvault show --name "$KEYVAULT_NAME" --resource-group "$OPS_RG" >/dev/null 2>&1; then
        az keyvault create --name "$KEYVAULT_NAME" --resource-group "$OPS_RG" --location "$LOCATION" --enable-rbac-authorization true --sku standard -o none
      fi
      KEYVAULT_ID=$(az keyvault show --name "$KEYVAULT_NAME" --resource-group "$OPS_RG" --query id -o tsv)
      CURRENT_USER_UPN=$(az account show --query user.name -o tsv 2>/dev/null || true)
      if [[ -n "$CURRENT_USER_UPN" ]]; then
        az role assignment create --assignee "$CURRENT_USER_UPN" --role "Key Vault Secrets Officer" --scope "$KEYVAULT_ID" -o none >/dev/null 2>&1 || true
      fi

      log "Ensure managed identities for secrets and cloud endpoints"
      if ! az identity show --name "$SECRET_SYNC_MI_NAME" --resource-group "$OPS_RG" >/dev/null 2>&1; then
        az identity create --name "$SECRET_SYNC_MI_NAME" --resource-group "$OPS_RG" --location "$LOCATION" -o none
      fi
      SECRET_MI_ID=$(az identity show --name "$SECRET_SYNC_MI_NAME" --resource-group "$OPS_RG" --query id -o tsv)
      if ! az identity show --name "$CLOUD_MI_NAME" --resource-group "$OPS_RG" >/dev/null 2>&1; then
        az identity create --name "$CLOUD_MI_NAME" --resource-group "$OPS_RG" --location "$LOCATION" -o none
      fi
      CLOUD_MI_ID=$(az identity show --name "$CLOUD_MI_NAME" --resource-group "$OPS_RG" --query id -o tsv)

      log "Enable AIO secret synchronization"
      az iot ops secretsync enable --instance "$AIO_INSTANCE_NAME" \
                                   --resource-group "$OPS_RG" \
                                   --mi-user-assigned "$SECRET_MI_ID" \
                                   --kv-resource-id "$KEYVAULT_ID"

      log "Assign cloud connection identity"
      set +e
      az iot ops identity assign --name "$AIO_INSTANCE_NAME" \
                                 --resource-group "$OPS_RG" \
                                 --mi-user-assigned "$CLOUD_MI_ID"
      ASSIGN_STATUS=$?
      set -e
      if [[ $ASSIGN_STATUS -ne 0 ]]; then
        echo "WARNING: az iot ops identity assign returned a non-zero status ($ASSIGN_STATUS). Continuing."
      fi
      log "Restart schema registry pods to pick up identity"
      kubectl delete pods -n azure-iot-operations -l app.kubernetes.io/name=adr-schema-registry --ignore-not-found --wait=false || true
      kubectl wait --for=condition=Ready pods -n azure-iot-operations -l app.kubernetes.io/name=adr-schema-registry --timeout=300s || true
      sync_kubeconfig

      # Simulator + quickstart Bicep
      log "Simulator + quickstart"
      kubectl apply -f https://raw.githubusercontent.com/Azure-Samples/explore-iot-operations/main/samples/quickstarts/opc-plc-deployment.yaml
      wget -q https://raw.githubusercontent.com/Azure-Samples/explore-iot-operations/main/samples/quickstarts/quickstart.bicep -O /root/quickstart.bicep

      EXT_NAME=$(az k8s-extension list -g "$OPS_RG" --cluster-name "$CLUSTER_NAME" --cluster-type connectedClusters --query "[?extensionType == 'microsoft.iotoperations'].name | [0]" -o tsv)
      CUSTOM_LOCATION_NAME=$(az iot ops list -g "$OPS_RG" --query "[?name=='$AIO_INSTANCE_NAME'].extendedLocation.name | [0]" -o tsv | awk -F'/' '{print $NF}')

      az deployment group create \
        --resource-group "$OPS_RG" \
        --template-file /root/quickstart.bicep \
        --parameters clusterName="$CLUSTER_NAME" \
                     customLocationName="$CUSTOM_LOCATION_NAME" \
                     aioExtensionName="$EXT_NAME" \
                     aioInstanceName="$AIO_INSTANCE_NAME" \
                     aioNamespaceName="$AIO_NAMESPACE_NAME"

      log "All done."

      # Wait for IoTOperationsLogs table to appear in Log Analytics
      log "Waiting for IoTOperationsLogs table to be created in Log Analytics workspace..."
      WORKSPACE_ID=$(az monitor log-analytics workspace show -g "$OPS_RG" -n "aio-laworkspace" --query customerId -o tsv)
      # IoTOperationsLogs table is not supported for diagnostic settings on AIO instance resource type
      log "NOTE: IoTOperationsLogs table and diagnostic settings are not supported for resource type 'microsoft.iotoperations/instances'. Skipping Log Analytics diagnostics setup."
runcmd:
  - [ bash, -lc, "/usr/local/bin/aio-install.sh > /var/log/aio-install.log 2>&1" ]
final_message: "AIO install finished. See /var/log/aio-install.log"
